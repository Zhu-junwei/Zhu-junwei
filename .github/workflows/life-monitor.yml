name: Life Monitor

on:
  schedule:
    # 北京时间每天 23:00 = UTC 15:00
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'

      - name: Run life monitor
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python life_monitor.py --auto
          else
            python life_monitor.py
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md .last_run
          git diff --cached --quiet || git commit -m "life monitor: ${{ github.event_name == 'schedule' && 'auto check' || 'manual check-in' }}"
          git push